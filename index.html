<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Keyboard Smash - Fun Typing Game for Toddlers</title>
  <meta name="description" content="A free toddler-friendly keyboard game. Press any key or tap the screen to pop colorful animal, star, and kid-favorite emojis with playful sounds. Works on mobile and desktop." />
  <meta name="keywords" content="keyboard smash, toddler game, kids typing game, baby keyboard app, emoji game for kids, keyboard mashing game" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://akhilsnaik.github.io/smashkeyboard/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Keyboard Smash - Fun Typing Game for Toddlers" />
  <meta property="og:description" content="Press any key or tap the screen to pop colorful emojis with playful sounds. A free, safe keyboard game for toddlers." />
  <meta property="og:url" content="https://akhilsnaik.github.io/smashkeyboard/" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Keyboard Smash - Fun Typing Game for Toddlers" />
  <meta name="twitter:description" content="Press any key or tap the screen to pop colorful emojis with playful sounds. A free, safe keyboard game for toddlers." />

  <meta name="theme-color" content="#a8edea" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="stage" aria-label="Type anything or tap the screen">
    <div class="hint">
      <div class="hint-emoji">⌨️ ✨ 👆</div>
      <p>Start typing<br /><span>or tap anywhere</span></p>
    </div>
    <div id="typedLine" class="typed-line" aria-hidden="true">
      <span id="cursor" class="cursor">|</span>
    </div>
    <div id="popup" class="popup" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
