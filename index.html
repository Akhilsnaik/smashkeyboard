<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Keyboard Smash!</title>
  <meta name="description" content="Press any key or tap the screen to smash out emojis!" />
  <meta name="theme-color" content="#a8edea" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="stage" aria-label="Smash the keyboard or tap the screen">
    <div class="hint">
      <div class="hint-emoji">⌨️ ✨ 👆</div>
      <p>Press any key<br /><span>or tap anywhere</span></p>
    </div>
    <div id="keyBadge" class="key-badge" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
